<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmbuLink+ | Hospital Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="display: none;">
    <div class="particles" id="particles"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div>
                <h1>🏥 Hospital Monitoring</h1>
                <p style="color: var(--text-muted);">Emergency Intake Management</p>
            </div>
            <button class="btn btn-secondary" style="width: auto;" onclick="logout()">Sign Out</button>
        </header>

        <!-- DASHBOARD STATS (Fake for realism) -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px;">
            <div class="card" style="padding: 20px; margin-bottom: 0;">
                <p style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Incoming</p>
                <p style="font-size: 1.8rem; font-weight: 700;" id="incoming-count">0</p>
            </div>
            <div class="card" style="padding: 20px; margin-bottom: 0;">
                <p style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Available Beds</p>
                <p style="font-size: 1.8rem; font-weight: 700; color: var(--accent);">14</p>
            </div>
            <div class="card" style="padding: 20px; margin-bottom: 0;">
                <p style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Trauma Team</p>
                <p style="font-size: 1.8rem; font-weight: 700; color: var(--warning);">On Standby</p>
            </div>
        </div>

        <!-- PATIENT MONITORING LIST -->
        <div id="hospital-requests-container">
            <h3 class="mb-4">Active Ambulance Intake</h3>
            
            <div id="no-patients" class="card text-center" style="padding: 60px;">
                <p style="color: var(--text-muted);">No active ambulance responses detected...</p>
            </div>

            <div id="patients-list">
                <!-- Intake cards injected here -->
            </div>
        </div>
    </div>

    <!-- ✅ Firebase SDKs (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAePTVnKSUw9owUVamA6bk6MVrYSBhKxEU",
            authDomain: "ambulink-dd25f.firebaseapp.com",
            databaseURL: "https://ambulink-dd25f-default-rtdb.firebaseio.com",
            projectId: "ambulink-dd25f",
            storageBucket: "ambulink-dd25f.firebasestorage.app",
            messagingSenderId: "331876122317",
            appId: "1:331876122317:web:09536ee69465c04b743384"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let checked = false;

        function showAccessDenied(message) {
            alert("Unauthorized access: " + message);
            document.body.innerHTML = `
                <div style="
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    background:#0f172a;
                    color:white;
                    text-align:center;
                    font-family: 'Inter', sans-serif;
                ">
                    <div>
                        <h2 style="color:#E63946; font-size: 2rem; margin-bottom: 20px;">
                            🚫 Access Denied
                        </h2>
                        <p style="color: #A0AEC0;">${message}</p>
                        <a href="login.html" style="display:inline-block; margin-top:30px; color:#3498DB; text-decoration:none; font-weight:600;">Return to Login</a>
                    </div>
                </div>
            `;
            document.body.style.display = 'block';
        }

        // ✅ Single Modular Auth Guard
        onAuthStateChanged(auth, async (user) => {
            if (checked) return;
            checked = true;

            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const snapshot = await get(ref(db, 'users/' + user.uid));
                
                if (!snapshot.exists()) {
                    showAccessDenied("User data not found");
                    return;
                }

                const role = snapshot.val().role;

                if (role !== 'hospital') {
                    showAccessDenied("Hospital role required");
                    return;
                }

                // Role verified, reveal page
                console.log("Hospital access granted");
                document.body.style.display = 'block';
            } catch (error) {
                console.error("Auth Guard Error:", error);
                showAccessDenied("Error fetching role");
            }
        });

        // Global logout for the button
        window.logout = async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        };
    </script>

    <!-- Legacy support for script.js (if still using v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
