<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmbuLink+ | Ambulance Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="display: none;">
    <div class="particles" id="particles"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div>
                <h1>🚑 Ambulance Portal</h1>
                <p style="color: var(--text-muted);">Active Unit Dashboard</p>
            </div>
            <button class="btn btn-secondary" style="width: auto;" onclick="logout()">Sign Out</button>
        </header>

        <!-- SOS REQUESTS LIST -->
        <div id="requests-container">
            <h3 class="mb-4">Live SOS Requests</h3>
            <div id="no-requests" class="card text-center" style="padding: 40px;">
                <p style="color: var(--text-muted);">Scanning for emergency signals...</p>
            </div>
            <div id="requests-list">
                <!-- Request cards injected here -->
            </div>
        </div>

        <!-- ACTIVE MISSION SECTION -->
        <div id="active-mission" class="hidden">
            <div class="card" style="border-left: 6px solid var(--accent);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;">
                    <div>
                        <h2 style="color: var(--accent);">Active Mission</h2>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">Responding to emergency now</p>
                    </div>
                    <div class="badge badge-active">Live Tracking Enabled</div>
                </div>

                <div id="mission-details" class="mb-8">
                    <!-- Dynamic mission details -->
                </div>
                
                <div class="form-group">
                    <label>Patient Vitals / Condition Update</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" id="condition-update" placeholder="e.g. Vitals stable, controlled bleeding">
                        <button class="btn btn-primary" style="width: auto;" id="send-update-btn">Update Hospital</button>
                    </div>
                </div>

                <!-- Green Corridor Section -->
                <div style="margin-top: 40px; border-top: 1px solid var(--border-glass); padding-top: 32px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3>🚦 Green Corridor System</h3>
                        <button class="btn btn-green" id="clearanceBtn" style="width: auto;">Request Clearance</button>
                    </div>

                    <div id="corridor-status" class="hidden">
                        <div class="signal-grid">
                            <div class="signal-node">
                                <div class="signal-light" id="signal1"></div>
                                <span style="font-size: 0.75rem;">Signal 01</span>
                            </div>
                            <div class="signal-node">
                                <div class="signal-light" id="signal2"></div>
                                <span style="font-size: 0.75rem;">Signal 02</span>
                            </div>
                            <div class="signal-node">
                                <div class="signal-light" id="signal3"></div>
                                <span style="font-size: 0.75rem;">Signal 03</span>
                            </div>
                        </div>
                        <p id="corridor-msg" class="text-center" style="color: var(--accent); font-weight: 600; font-size: 0.9rem;"></p>
                    </div>
                </div>

                <div style="margin-top: 48px;">
                    <button class="btn btn-secondary" id="complete-mission-btn">Mark Mission as Completed</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ Firebase SDKs (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAePTVnKSUw9owUVamA6bk6MVrYSBhKxEU",
            authDomain: "ambulink-dd25f.firebaseapp.com",
            databaseURL: "https://ambulink-dd25f-default-rtdb.firebaseio.com",
            projectId: "ambulink-dd25f",
            storageBucket: "ambulink-dd25f.firebasestorage.app",
            messagingSenderId: "331876122317",
            appId: "1:331876122317:web:09536ee69465c04b743384"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let checked = false;

        function showAccessDenied(message) {
            alert("Unauthorized access: " + message);
            document.body.innerHTML = `
                <div style="
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    background:#0f172a;
                    color:white;
                    text-align:center;
                    font-family: 'Inter', sans-serif;
                ">
                    <div>
                        <h2 style="color:#E63946; font-size: 2rem; margin-bottom: 20px;">
                            🚫 Access Denied
                        </h2>
                        <p style="color: #A0AEC0;">${message}</p>
                        <a href="login.html" style="display:inline-block; margin-top:30px; color:#3498DB; text-decoration:none; font-weight:600;">Return to Login</a>
                    </div>
                </div>
            `;
            document.body.style.display = 'block';
        }

        // ✅ Single Modular Auth Guard
        onAuthStateChanged(auth, async (user) => {
            if (checked) return;
            checked = true;

            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const snapshot = await get(ref(db, 'users/' + user.uid));
                
                if (!snapshot.exists()) {
                    showAccessDenied("User data not found");
                    return;
                }

                const role = snapshot.val().role;

                if (role !== 'driver') {
                    showAccessDenied("Driver role required");
                    return;
                }

                // Role verified, reveal page
                console.log("Ambulance access granted");
                document.body.style.display = 'block';
            } catch (error) {
                console.error("Auth Guard Error:", error);
                showAccessDenied("Error fetching role");
            }
        });

        // Global logout for the button
        window.logout = async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        };

        // ✅ Modular Start Tracking for Ambulance
        window.startAmbulanceTracking = (requestId) => {
            if (navigator.geolocation) {
                console.log("Starting Live Tracking for Request:", requestId);
                navigator.geolocation.watchPosition(
                    async (position) => {
                        const { latitude, longitude } = position.coords;
                        try {
                            const ambulanceLocRef = ref(db, `requests/${requestId}/ambulanceLocation`);
                            await update(ref(db, `requests/${requestId}`), {
                                ambulanceLocation: {
                                    latitude: latitude,
                                    longitude: longitude,
                                    lastUpdated: new Date().toISOString()
                                }
                            });
                            console.log("Location Updated:", latitude, longitude);
                        } catch (err) {
                            console.error("Firebase Update Error:", err);
                        }
                    },
                    (err) => console.error("Geolocation Error:", err),
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Geolocation not supported by this browser.");
            }
        };
    </script>

    <!-- Legacy support for script.js (if still using v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
